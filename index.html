<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🍺 Estalagem da Pia — Casa Reguladora</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at top, #1c1917 0%, #0c0a09 100%);
      color: #e7e5e4;
      font-family: 'MedievalSharp', serif, system-ui;
      min-height: 100vh;
    }
    h1, h2, h3, .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .tavern-card {
      background: rgba(28, 25, 23, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid #78350f;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(120, 53, 15, 0.2);
    }
    .gold-border {
      border-color: #b45309;
    }
    .glow-gold {
      box-shadow: 0 0 15px rgba(217, 119, 6, 0.3);
    }
  </style>
</head>
<body class="p-4 md:p-8">

  <div x-data="cicloPiaApp()" x-init="initFirebase()" class="max-w-md mx-auto space-y-6">

    <!-- HEADER DA ESTALAGEM -->
    <header class="tavern-card rounded-3xl p-6 text-center relative overflow-hidden gold-border glow-gold">
      <div class="flex justify-between items-center mb-2">
        <span class="text-[10px] font-cinzel font-bold uppercase tracking-widest text-amber-500">Casa Reguladora</span>
        <span x-show="loading" class="text-[10px] text-amber-400 bg-amber-950/80 px-2.5 py-1 rounded-full animate-pulse border border-amber-700">Conectando...</span>
      </div>
      <h1 class="text-2xl font-black text-amber-100 flex items-center justify-center gap-2">
        🍺 Estalagem da Pia
      </h1>
      <p class="text-xs text-amber-200/70 mt-1 italic">"Passo a passo, de dois em dois itens."</p>
    </header>

    <!-- TELA 1: ESCOLHA DA INTENÇÃO -->
    <template x-if="modo === 'seleção'">
      <div class="tavern-card rounded-3xl p-6 space-y-4">
        <h2 class="text-sm font-bold text-amber-200 text-center font-cinzel tracking-wide">Como podemos facilitar a vida da próxima Bárbara hoje?</h2>
        
        <div class="space-y-3">
          <!-- Nível 1 -->
          <button @click="iniciarNivel('minimo')" class="w-full p-4 bg-emerald-950/40 hover:bg-emerald-900/60 border border-emerald-700/60 rounded-2xl text-left transition flex items-center justify-between group">
            <div>
              <div class="font-bold text-emerald-300 text-sm flex items-center gap-2 font-cinzel">🕯️ Acender a Lareira <span class="text-[10px] bg-emerald-950 px-2 py-0.5 rounded-full text-emerald-300 border border-emerald-800">3-8 min</span></div>
              <p class="text-xs text-stone-300 mt-1">Lixo fora, panela de molho e liberar a bancada. Sem lavar louça.</p>
            </div>
            <span class="text-xl group-hover:translate-x-1 transition">✨</span>
          </button>

          <!-- Nível 2 -->
          <button @click="iniciarNivel('medio')" class="w-full p-4 bg-amber-950/40 hover:bg-amber-900/60 border border-amber-700/60 rounded-2xl text-left transition flex items-center justify-between group">
            <div>
              <div class="font-bold text-amber-300 text-sm flex items-center gap-2 font-cinzel">🍞 Preparar a Mesa <span class="text-[10px] bg-amber-950 px-2 py-0.5 rounded-full text-amber-300 border border-amber-800">Micro-etapas</span></div>
              <p class="text-xs text-stone-300 mt-1">Garantir talheres e pratos em pequenos lotes de 2 itens por vez.</p>
            </div>
            <span class="text-xl group-hover:translate-x-1 transition">🌾</span>
          </button>

          <!-- Nível 3 -->
          <button @click="iniciarNivel('completo')" class="w-full p-4 bg-yellow-950/40 hover:bg-yellow-900/60 border border-yellow-600/60 rounded-2xl text-left transition flex items-center justify-between group">
            <div>
              <div class="font-bold text-yellow-300 text-sm flex items-center gap-2 font-cinzel">👑 Restaurar o Salão <span class="text-[10px] bg-yellow-950 px-2 py-0.5 rounded-full text-yellow-300 border border-yellow-700">Completo</span></div>
              <p class="text-xs text-stone-300 mt-1">Micro-etapas + panelas + passar pano para deixar o salão zerado.</p>
            </div>
            <span class="text-xl group-hover:translate-x-1 transition">👑</span>
          </button>
        </div>
      </div>
    </template>

    <!-- TELA 2: EXECUÇÃO DAS MICRO-ETAPAS -->
    <template x-if="modo === 'execucao'">
      <div class="space-y-4">
        
        <!-- BARRA DE CONTINUIDADE -->
        <div class="tavern-card rounded-2xl p-4">
          <div class="flex justify-between text-xs font-bold mb-1.5">
            <span class="text-amber-200 font-cinzel" x-text="nomeNivelAtual()"></span>
            <span class="text-amber-400 font-cinzel" x-text="percent + '%'"></span>
          </div>
          <div class="w-full bg-stone-900 rounded-full h-3 overflow-hidden border border-stone-700">
            <div class="bg-gradient-to-r from-amber-700 via-amber-500 to-yellow-400 h-full transition-all duration-300" :style="'width: ' + percent + '%'"></div>
          </div>
        </div>

        <!-- PASSO ATUAL HIPERESPECÍFICO -->
        <div class="tavern-card rounded-3xl p-6 gold-border space-y-4">
          <div class="flex justify-between items-center text-xs font-bold text-amber-400 uppercase tracking-wider font-cinzel">
            <span>🌱 Micro-Ação</span>
            <span x-text="(currentStep + 1) + ' / ' + activeSteps.length"></span>
          </div>

          <div class="bg-stone-950/80 p-5 rounded-2xl border border-stone-800 space-y-2 text-center">
            <span class="text-5xl block my-2" x-text="activeSteps[currentStep].icon"></span>
            <h3 class="text-xl font-black text-amber-100 font-cinzel" x-text="activeSteps[currentStep].title"></h3>
            <p class="text-xs text-stone-300 mt-1 leading-relaxed" x-text="activeSteps[currentStep].desc"></p>
          </div>

          <!-- BOTÃO DE CONCLUSÃO RÁPIDA -->
          <button @click="completeCurrent()" class="w-full py-4 bg-gradient-to-r from-emerald-600 via-teal-600 to-emerald-500 hover:from-emerald-500 hover:to-teal-500 text-stone-950 font-black text-base rounded-2xl shadow-lg transition active:scale-95 flex items-center justify-center gap-2 font-cinzel tracking-wider">
            ✨ CONCLUÍ ESSES 2! PROXIMO ➡️
          </button>

          <!-- PERMISSÃO DE PAUSA -->
          <button @click="finalizarComVitoria()" class="w-full py-3 bg-stone-900 hover:bg-stone-800 text-amber-200/90 font-medium rounded-xl text-xs transition border border-stone-800 font-cinzel flex flex-col items-center justify-center gap-0.5">
            <span>🌿 Pausa dos Hobbits</span>
            <span class="text-[10px] text-stone-400 font-sans font-normal">A próxima refeição já ganhou utensílios. Posso parar agora.</span>
          </button>
        </div>

      </div>
    </template>

    <!-- TELA 3: CELEBRAÇÃO DA CONTINUIDADE -->
    <template x-if="modo === 'concluido'">
      <div class="tavern-card rounded-3xl p-6 text-center space-y-5 gold-border glow-gold">
        <span class="text-5xl block animate-bounce">🏡</span>
        <div>
          <h2 class="text-xl font-black text-amber-100 font-cinzel">A Próxima Refeição Está Protegida!</h2>
          <p class="text-xs text-amber-300 font-medium mt-1">Você concluiu os pequenos ciclos que importam.</p>
        </div>
        
        <div class="bg-stone-950/90 p-4 rounded-2xl text-left text-xs space-y-2.5 border border-amber-900/60">
          <div class="font-bold text-amber-400 uppercase tracking-widest text-[10px] font-cinzel border-b border-amber-900/40 pb-1">Conquistas dos Micro-Passos:</div>
          <div class="text-stone-200 flex items-center gap-2">🍴 Garfos, facas e colheres limpos em pares</div>
          <div class="text-stone-200 flex items-center gap-2">🍽️ Pratos prontos para uso sem estresse</div>
          <div class="text-stone-200 flex items-center gap-2">🧠 Zero atrito e zero sobrecarga cognitiva</div>
        </div>

        <button @click="resetApp()" class="w-full py-3.5 bg-amber-950 hover:bg-amber-900 text-amber-200 font-bold rounded-xl text-xs transition border border-amber-700 font-cinzel tracking-wider">
          📜 Encerrar e Retornar ao Início
        </button>
      </div>
    </template>

  </div>

  <!-- FIREBASE INTERFACE MODULE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyADaw2Lx7y28FEJIGbPd2zs4cnrCPiNkOc",
      authDomain: "pia-completa.firebaseapp.com",
      projectId: "pia-completa",
      storageBucket: "pia-completa.firebasestorage.app",
      messagingSenderId: "84789508555",
      appId: "1:84789508555:web:4bccf6f34024a29eb3de4e",
      measurementId: "G-LBQGK58Z4K"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.db = db;
    window.doc = doc;
    window.setDoc = setDoc;
    window.onSnapshot = onSnapshot;
  </script>

  <!-- LÓGICA DO APP (AlpineJS) -->
  <script>
    function cicloPiaApp() {
      return {
        loading: true,
        modo: 'seleção',
        nivelSelecionado: null,
        currentStep: 0,
        
        // LISTA COM AS MICRO-ETAPAS SEPARADAS E INDIVIDUAIS
        allSteps: [
          // Nível 1: Acender a Lareira (Preparação da Cozinha)
          { id: 's1', nivel: 'minimo', title: 'Tirar Restos no Lixo', icon: '🗑️', desc: 'Apenas empurrar os restos de comida para o lixo.', done: false },
          { id: 's2', nivel: 'minimo', title: 'Panelas de Molho', icon: '🫖', desc: 'Colocar água com detergente na panela mais difícil.', done: false },
          { id: 's3', nivel: 'minimo', title: 'Liberar a Bancada', icon: '📦', desc: 'Abrir um espaço livre na bancada para trabalhar.', done: false },
          
          // Nível 2: Preparar a Mesa (Desmembrado de 2 em 2!)
          { id: 's4', nivel: 'medio', title: 'Liberar o Escorredor', icon: '🧺', desc: 'Guardar louça seca só até o escorredor ter espaço.', done: false },
          { id: 's5', nivel: 'medio', title: 'Lavar 2 Copos', icon: '🥛', desc: 'Apenas 2 copos. Molhou, ensabocou, enxaguou.', done: false },
          { id: 's6', nivel: 'medio', title: 'Lavar 2 Garfos', icon: '🍴', desc: 'Pegar e lavar apenas 2 garfos.', done: false },
          { id: 's7', nivel: 'medio', title: 'Lavar 2 Facas', icon: '🔪', desc: 'Pegar e lavar apenas 2 facas com cuidado.', done: false },
          { id: 's8', nivel: 'medio', title: 'Lavar 2 Colheres', icon: '🥄', desc: 'Pegar e lavar apenas 2 colheres.', done: false },
          { id: 's9', nivel: 'medio', title: 'Lavar 2 Pegadores / Utensílios', icon: '🥢', desc: 'Lavar 2 pegadores, conchas ou colheres de pau.', done: false },
          { id: 's10', nivel: 'medio', title: 'Lavar 2 Pratos', icon: '🍽️', desc: 'Finalizar lavando apenas 2 pratos.', done: false },

          // Nível 3: Restaurar o Salão (Finalização)
          { id: 's11', nivel: 'completo', title: 'Acolher as Panelas', icon: '🍳', desc: 'Lavar a panela que ficou de molho.', done: false },
          { id: 's12', nivel: 'completo', title: 'Enxaguar a Pia', icon: '🧽', desc: 'Passar a bucha rápida na cuba da pia.', done: false },
          { id: 's13', nivel: 'completo', title: 'Passar Pano na Bancada', icon: '✨', desc: 'Secar a bancada e fechar o ciclo com paz.', done: false }
        ],

        activeSteps: [],

        get percent() {
          if (!this.activeSteps.length) return 0;
          let doneCount = this.activeSteps.filter(s => s.done).length;
          return Math.round((doneCount / this.activeSteps.length) * 100);
        },

        iniciarNivel(nivel) {
          this.nivelSelecionado = nivel;
          if (nivel === 'minimo') {
            this.activeSteps = this.allSteps.filter(s => s.nivel === 'minimo');
          } else if (nivel === 'medio') {
            this.activeSteps = this.allSteps.filter(s => s.nivel === 'minimo' || s.nivel === 'medio');
          } else {
            this.activeSteps = [...this.allSteps];
          }
          this.currentStep = 0;
          this.modo = 'execucao';
          this.saveState();
        },

        nomeNivelAtual() {
          if (this.nivelSelecionado === 'minimo') return '🕯️ Acender a Lareira';
          if (this.nivelSelecionado === 'medio') return '🍞 Preparar a Mesa';
          return '👑 Restaurar o Salão';
        },

        completeCurrent() {
          this.activeSteps[this.currentStep].done = true;
          if (this.currentStep < this.activeSteps.length - 1) {
            this.currentStep++;
          } else {
            this.modo = 'concluido';
          }
          this.saveState();
        },

        finalizarComVitoria() {
          this.modo = 'concluido';
          this.saveState();
        },

        resetApp() {
          this.allSteps.forEach(s => s.done = false);
          this.activeSteps = [];
          this.currentStep = 0;
          this.modo = 'seleção';
          this.saveState();
        },

        async initFirebase() {
          const checkDb = setInterval(() => {
            if (window.db) {
              clearInterval(checkDb);
              const docRef = window.doc(window.db, "modo_casa", "ciclo_pia");
              window.onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                  const data = docSnap.data();
                  if (data.modo) this.modo = data.modo;
                  if (data.nivelSelecionado) this.nivelSelecionado = data.nivelSelecionado;
                }
                this.loading = false;
              });
            }
          }, 100);
        },

        async saveState() {
          if (!window.db) return;
          const payload = { 
            modo: this.modo, 
            nivelSelecionado: this.nivelSelecionado,
            currentStep: this.currentStep 
          };
          const docRef = window.doc(window.db, "modo_casa", "ciclo_pia");
          await window.setDoc(docRef, payload, { merge: true });
        }
      }
    }
  </script>
</body>
</html>
